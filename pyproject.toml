[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "perno"
version = "0.1.0"
description = "Wysyłka maili B2B, skraper stron firm i panel w przeglądarce"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "PyMySQL[rsa]>=1.1,<2",
    "openpyxl>=3.1,<4",
    "Pillow>=10,<13",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",  # szybszy parser HTML, używany od fazy 4.4 planu przebudowy
]

[project.scripts]
perno-server = "perno.cli.server:main"
perno-send = "perno.cli.send:main"
perno-scrape = "perno.cli.scrape:main"
perno-automat = "perno.cli.automat:main"
perno-firms = "perno.cli.firms:main"
perno-enrich = "perno.cli.enrich:main"
perno-migrate = "perno.cli.migrate:main"
perno-seed = "perno.cli.seed:main"
perno-dashboard = "perno.cli.dashboard:main"
perno-dbcheck = "perno.cli.dbcheck:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest>=8",
    "pytest-cov",
    "pytest-xdist",
    "import-linter",
    "pip-audit",
    "pytest-timeout>=2.4.0",
]

[tool.uv]
package = true   # układ src/perno, instalacja edytowalna (uv sync)

# ---------------------------------------------------------------------------------------------
# Linter. Reguły łapiące błędy (F, B, BLE, S, C90, PLR) są egzekwowane od razu; reguły stylu,
# których naruszenia już istnieją, są wyłączone poniżej wraz z liczbą wystąpień w chwili
# wprowadzenia (faza 0) i wracają stopniowo w fazach 1-3 (każda jako osobny commit).
# ---------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["backup", "logs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE", "S", "C90", "PLR0912", "PLR0913", "PLR0915", "T20", "RUF", "D101", "D103"]
ignore = [
    "E501",    # 255x przy 120; brak formatera, długie komentarze po polsku — nie egzekwujemy
    "UP035", "UP037", "UP045", "UP017", "UP041", "UP012",  # ~175x; modernizacja typów (Optional[X] -> X | None) po fazie 1
    "S311",    # random służy do jittera i opóźnień, nie do kryptografii
    "RUF001", "RUF002", "RUF003",  # polskie cudzysłowy typograficzne w tekstach i docstringach
    "RUF005", "RUF059", "RUF007", "RUF021", "B007", "B905", "E702", "E731",  # styl, ~50x; przegląd w fazie 3
    "SIM102", "SIM105", "SIM109", "SIM113", "SIM117", "SIM905",             # styl, ~12x; przegląd w fazie 3
]

[tool.ruff.lint.per-file-ignores]
# Skrypty CLI drukują wynik dla człowieka; biblioteka przechodzi na logging w fazie 3.4.
"src/perno/cli/**" = ["T201"]
"scripts/**" = ["T201", "S603"]                # narzędzia deweloperskie: drukują wynik i uruchamiają pytest
"src/perno/scraper/runner.py" = ["T201"]        # RunLogger drukuje linie logu (faza 4.11)
"tests/**" = ["S104", "S105", "S106", "S107", "S603", "RUF012", "PLR0912", "PLR0913", "PLR0915", "C901", "D101", "D103"]
# Docstringi publicznych klas i funkcji wymagamy w domain/ i services/ (reguły biznesowe); reszta ma bazę do uzupełnienia.
"src/perno/{scraper,web,cli,db,mailer,notify,system}/**" = ["D101", "D103"]

[tool.ruff.lint.mccabe]
max-complexity = 15    # ratchet: 26 -> 15 (faza 2.6) -> 10; dziś największa funkcja ma 14

[tool.ruff.lint.pylint]
max-args = 8           # ratchet: 14 -> 8 (faza 2.6) -> 6; wyjątki: trzy konstruktory ze szwami wstrzykiwania (noqa)
max-branches = 15      # ratchet: 30 -> 15 (faza 2.6) -> 12
max-statements = 50    # ratchet: 70 -> 50 (faza 2.6)

# ---------------------------------------------------------------------------------------------
# Typy. Moduły bez błędów są sprawdzane w całości od razu; moduły z istniejącymi błędami (baza z fazy 0:
# 118 błędów w 20 modułach) mają `ignore_errors` i wracają do kontroli po refaktoryzacji (fazy 2-3).
# Wiele błędów ma jedną przyczynę: `Optional` bez zawężenia w crawler.py, brak atrybutów `bulk_log` i
# `skraper_store` na App (znikają w fazie 2.1), `**_OPTS` w schema.py (typ słownika).
# ---------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["perno.domain.*", "perno.services.*"]
disallow_untyped_defs = true       # kod z regułami biznesowymi ma pełne adnotacje (plan 3.5)
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "perno.scraper.schema",       # 36
    "perno.mailer.smtp_client",   # 5
    "perno.scraper.fetcher",      # 5
]
ignore_errors = true

# Testy to `unittest.TestCase`; działają też przez `python -m unittest discover -s tests -t .` (README).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: wolne testy (prawdziwe odliczanie czasu, podprocesy); szybka warstwa: pytest -m 'not slow'",
]

# ---------------------------------------------------------------------------------------------
# Warstwy (egzekwowane przez `lint-imports` w scripts/check.sh). Dziś zabraniamy zależności "w górę";
# w fazie 2 dojdą kontrakty dla usług i adapterów, gdy zostaną rozdzielone.
# ---------------------------------------------------------------------------------------------
[tool.importlinter]
root_package = "perno"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain nie zależy od adapterów, usług, WWW ani CLI"
type = "forbidden"
source_modules = ["perno.domain"]
forbidden_modules = ["perno.db", "perno.mailer", "perno.notify", "perno.system", "perno.services", "perno.scraper", "perno.web", "perno.cli"]

[[tool.importlinter.contracts]]
name = "domain jest czysty (bez bazy, sieci, parserów i plików biurowych)"
type = "forbidden"
source_modules = ["perno.domain"]
forbidden_modules = ["sqlalchemy", "pymysql", "bs4", "lxml", "openpyxl", "PIL"]

[[tool.importlinter.contracts]]
name = "adaptery (db, mailer, notify, system, scraper) nie zależą od usług, WWW ani CLI"
type = "forbidden"
source_modules = ["perno.db", "perno.mailer", "perno.notify", "perno.system", "perno.scraper"]
forbidden_modules = ["perno.services", "perno.web", "perno.cli"]
ignore_imports = ["perno.db.__main__ -> perno.cli.dbcheck"]  # `python -m perno.db` to tylko skrót do polecenia z cli/

[[tool.importlinter.contracts]]
name = "SQL tylko w adapterach: usługi, WWW i CLI nie importują sqlalchemy"
type = "forbidden"
source_modules = ["perno.services", "perno.web", "perno.cli"]
forbidden_modules = ["sqlalchemy"]
allow_indirect_imports = true  # liczą się tylko bezpośrednie importy (adaptery oczywiście używają sqlalchemy)

[[tool.importlinter.contracts]]
name = "usługi nie zależą od WWW ani CLI"
type = "forbidden"
source_modules = ["perno.services"]
forbidden_modules = ["perno.web", "perno.cli"]

[[tool.importlinter.contracts]]
name = "WWW nie zależy od CLI"
type = "forbidden"
source_modules = ["perno.web"]
forbidden_modules = ["perno.cli"]
